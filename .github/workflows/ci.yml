name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# WHAT IS GATED, AND WHY IT IS SCOPED THAT WAY
#
# The shipping artifact is `rusty_json_turbo` (the library, crate name
# `serde_json`), plus the `rjson` CLI and the allocator seam. Those are held to
# `-D warnings` and tested on three OSes, on the MSRV, and across the eight
# targets the house ships.
#
# `rusty_json_turbo-bench` is the harness: it links upstream serde_json as the
# ORACLE and runs the differential gate (bytes, Value, error text + line/col,
# float bits) over the corpus. That gate is a test and runs here on every push.
# The competitor arms (simd-json, sonic-rs) are behind `--features competitors`
# and are only checked for compilation.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # THE CORPUS IS THE MEASUREMENT, so its bytes are gated before anything
      # runs on them, and gated on all three runners -- which is the point.
      # This check did not exist, and its absence hid a real defect: with no
      # root `.gitattributes`, a `core.autocrlf=true` checkout rewrote every
      # payload's line endings, so `HASHES.txt` held the CRLF hashes and was
      # valid only on Windows, CI was benchmarking a `twitter.json` 2.4%
      # smaller than a Windows developer was, and `corpus/fetch.ps1` -- whose
      # entire job is to re-download and verify -- would have failed for
      # anyone who ran it. Verifying on three platforms is what makes
      # "platform-independent" a checked claim rather than an intention.
      - name: The corpus is byte-for-byte the manifest, on every platform
        shell: bash
        working-directory: corpus
        run: |
          shasum -a 256 -c HASHES.txt             || sha256sum -c HASHES.txt             || { echo '::error::corpus does not match HASHES.txt -- see the root .gitattributes'; exit 1; }
      - name: Upstream test suite against the fork
        run: cargo test -p rusty_json_turbo --locked
      - name: Feature matrix (upstream's own list)
        shell: bash
        run: |
          for f in preserve_order float_roundtrip arbitrary_precision float_roundtrip,arbitrary_precision raw_value unbounded_depth; do
            cargo test -p rusty_json_turbo --locked --features "$f" --tests -- --skip ui --exact
          done
      - name: Differential oracle (byte-identical to upstream serde_json)
        run: cargo test -p rusty_json_turbo-bench --locked -- --nocapture
      # The soak is the same question as fuzz/oracle_diff, asked on every runner
      # and every OS: libFuzzer needs nightly and a matching sanitizer runtime,
      # this needs neither. Seeded, so a failure here reproduces exactly.
      - name: Differential soak (300k generated + mutated + numeric cases)
        run: cargo test -p rusty_json_turbo-bench --release --locked --test soak -- --nocapture
        env:
          RJT_SOAK: 100000
      - name: Differential oracle, per feature (both arms on)
        shell: bash
        run: |
          for f in preserve_order float_roundtrip arbitrary_precision raw_value unbounded_depth; do
            cargo test -p rusty_json_turbo-bench --locked --features "$f" --test oracle
          done
      # THE PER-ARCH CENSUS, on each runner's own architecture. `macos-latest`
      # is Apple Silicon, so this is where aarch64 gets EXECUTED rather than
      # only compile-checked -- and the census prints the arch it ran on, so
      # if that ever stops being true the coverage does not vanish silently.
      #
      # What it guards is invisible to every output gate: the wide scanners are
      # 8-byte SWAR behind length guards, so an architecture where those guards
      # never passed would produce completely correct output at the speed of
      # the per-byte fallback.
      - name: The wide kernels are reached on this architecture
        run: cargo test -p rusty_json_turbo-bench --locked --features count-work --test m6_arch_census -- --nocapture
      - name: CLI and seam
        run: |
          cargo test -p rusty_json_turbo-cli -p rusty_json_turbo-alloc --locked
          cargo run -p rusty_json_turbo-cli --locked -- --version
          cargo run -p rusty_json_turbo-cli --locked -- validate corpus/twitter.json

  # The eight targets the house ships, library only, default and no_std+alloc.
  check-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.target }}
      - name: default features
        run: cargo check -p rusty_json_turbo --locked --target ${{ matrix.target }}
      - name: no_std + alloc
        run: cargo check -p rusty_json_turbo --locked --target ${{ matrix.target }} --no-default-features --features alloc
      - name: every feature, no_std + alloc
        run: cargo check -p rusty_json_turbo --locked --target ${{ matrix.target }} --no-default-features --features alloc,float_roundtrip,arbitrary_precision,raw_value,unbounded_depth

  # Upstream's own no_std probe crate, unchanged apart from the package rename.
  portable:
    name: no_std probe crate + profile feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml selects the pinned toolchain; a target given to the
      # action lands on `stable`, not on it. Add it to the active toolchain.
      - run: rustup target add aarch64-unknown-none
      # `cargo check` here proves every public item RESOLVES without `std`,
      # which a check of the library alone does not: an unreferenced
      # `#[cfg(feature = "std")]` item is not an error until something names
      # it, and `pub use serde_json::*;` names them all.
      - run: cargo check --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc
      - run: cargo check --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,arbitrary_precision
      - run: cargo check --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,raw_value
      # A target with no `std` AT ALL, so nothing can quietly fall back to it.
      - run: cargo check --manifest-path tests/crate/Cargo.toml --target aarch64-unknown-none --no-default-features --features alloc
      # AND IT HAS TO RUN. Until M6 the `--no-default-features --features
      # alloc` configuration was checked on eight targets and executed on
      # NONE, so its `#[cfg(not(feature = "std"))]` branches -- the error type,
      # and `IoRead`'s absence -- had never run once. The probe now asserts
      # real answers, including exact error text and line/column, through an
      # ordinary std test target that calls into the `no_std` library (an
      # integration test is a separate crate, so the library still links no
      # `std`).
      - run: cargo test --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc
      - run: cargo test --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,raw_value
      - run: cargo test --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,arbitrary_precision
      - run: cargo test --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,float_roundtrip
      - run: cargo check -p rusty_json_turbo --locked --features profile


  # WASM IS A TESTED TARGET, not a checked one -- G5 asks for a run under
  # wasmtime and this is it. The distinction matters: `cargo check` cannot
  # catch a wrong ANSWER, and the places a JSON parser gets a different answer
  # on a different target are real. Every buffer index, the recursion guard and
  # `IoRead`'s window arithmetic are `usize`, which is 32 bits here and 64
  # everywhere else in this matrix, and `src/swar.rs` does 8-byte loads on the
  # whitespace scan, the escape scan and the eight-digit number fold.
  #
  # `wasm32-unknown-unknown` stays check-only in the matrix above: it has no
  # platform for libtest to stand on. `wasm32-wasip1` does, so the real suite
  # runs.
  wasm:
    name: wasm32-wasip1 under wasmtime
    runs-on: ubuntu-latest
    env:
      # WASI can only open directories it was explicitly granted, has no drive
      # letters, and resolves nothing from `CARGO_MANIFEST_DIR` (which is baked
      # in at compile time as an absolute HOST path). So the repo is mounted at
      # a guest path and the corpus is named through `RJT_CORPUS`.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=${{ github.workspace }}::/repo --env RJT_CORPUS=/repo/corpus
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1
      # The Bytecode Alliance's own action for their own runtime, pinned.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "48.0.1"
      - run: wasmtime --version
      # `rust-toolchain.toml` pins the toolchain, and a target passed to the
      # action lands on `stable` rather than on it -- the same trap the
      # `portable` job documents.
      - run: rustup target add wasm32-wasip1
      - name: The library's own suite, on wasm
        run: cargo test -p rusty_json_turbo --locked --target wasm32-wasip1
      - name: The differential oracle vs upstream serde_json, on wasm
        run: cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --test oracle
      - name: The differential soak, on wasm
        run: cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --test soak
        env:
          RJT_SOAK: 20000
      - name: Cold paths, brick gates and reachability, on wasm
        run: |
          cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --test s6_cold_paths
          cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --test b14_reachability
          cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --test b15s_key_fold
          cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --features raw_value --test b13_raw_range
          cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --features raw_value,count-work --test b13_counters
      # THE PER-ARCH CENSUS. The failure mode it guards is invisible to every
      # output gate: the wide scanners are 8-byte SWAR behind length guards, so
      # a target where those guards never passed would produce completely
      # correct output at the speed of the per-byte fallback. Measured, wasm32
      # produces counter readings byte-for-byte identical to x86_64.
      - name: The wide kernels are reached on wasm32, and do identical work
        run: cargo test -p rusty_json_turbo-bench --locked --target wasm32-wasip1 --features count-work --test m6_arch_census -- --nocapture
      - name: The no_std + alloc configuration RUNS on wasm
        run: cargo test --manifest-path tests/crate/Cargo.toml --target wasm32-wasip1 --no-default-features --features alloc
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      # THE BROWSER TARGET, which is a different claim from WASI. Everything
      # above runs on `wasm32-wasip1`, where there IS a platform underneath --
      # a filesystem, a clock, an environment. A browser has none of that, so
      # the browser claim has to be made on `wasm32-unknown-unknown`, and it is
      # made the only way that cannot be fudged: parse and re-serialize real
      # corpus documents inside the module and compare the OUTPUT BYTES with
      # native, through a checksum.
      #
      # The parser is linked ALLOC-ONLY there, so this is also the only gate
      # that proves the alloc-only configuration produces correct bytes on the
      # browser target rather than merely compiling for it. `canada` is in the
      # set on purpose: 2.25 MB of floating point is the family most likely to
      # differ between targets and the one where a difference would be a silent
      # wrong answer rather than a crash.
      #
      # The test also FAILS if the module needs any host import: a Rust cdylib
      # for this target should have none, and one appearing means a platform
      # dependency crept into a build claiming not to have one.
      - name: The browser target's bytes match native, checksum for checksum
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p rusty_json_turbo-wasmdemo --locked --target wasm32-unknown-unknown --release
          node --version
          cargo test -p rusty_json_turbo-wasmdemo --locked -- --nocapture

  # aarch64-LINUX, EXECUTED rather than compiled. This was M6's one named gap.
  #
  # aarch64 already executes the full suite on `macos-latest` (Apple Silicon),
  # so what this adds is not the architecture -- it is the architecture on a
  # DIFFERENT libc, under a runner that does not depend on what
  # `macos-latest` happens to mean this year. qemu-user gives correctness, not
  # timing: a qemu number is meaningless and no measurement is taken here.
  # The census is the point -- it asserts the 8-byte SWAR kernels are actually
  # reached on aarch64, which no output gate can see.
  aarch64-linux:
    name: aarch64-unknown-linux-gnu under qemu
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-qemu
      - run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
      # `rust-toolchain.toml` pins the toolchain and a target given to the
      # action lands on `stable` instead -- the same trap the `portable` and
      # `wasm` jobs document.
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: qemu-aarch64 --version
      - name: The library's own suite, on aarch64
        run: cargo test -p rusty_json_turbo --locked --target aarch64-unknown-linux-gnu
      - name: The differential oracle vs upstream, on aarch64
        run: cargo test -p rusty_json_turbo-bench --locked --target aarch64-unknown-linux-gnu --test oracle
      - name: The wide kernels are reached on aarch64, and do identical work
        run: cargo test -p rusty_json_turbo-bench --locked --target aarch64-unknown-linux-gnu --features count-work --test m6_arch_census -- --nocapture
      - name: The no_std + alloc configuration RUNS on aarch64
        run: cargo test --manifest-path tests/crate/Cargo.toml --target aarch64-unknown-linux-gnu --no-default-features --features alloc

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rusty_json_turbo --locked --all-features
        env:
          RUSTUP_TOOLCHAIN: 1.85.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: ASCII sources
        run: bash scripts/check-ascii-rs.sh src crates
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # The harness in every configuration the ledger takes numbers from. Each is a
  # separate BINARY (the allocator is a link-time property), so each has to keep
  # compiling or a measurement arm silently disappears.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features competitors
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features rusty-alloc
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features rusty-alloc-secure
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features profile
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features turbo/knobs
      # The A/B knob must actually switch the arm, and BOTH arms must agree with
      # upstream. A knob that silently does nothing would let a brick look free.
      - name: Both arms of the whitespace knob agree with upstream
        run: |
          for v in 0 1; do
            RJT_WS_FASTPATH=$v cargo run -p rusty_json_turbo-bench --release --locked \
              --features turbo/knobs -- diff-oracle corpus/citm_catalog.json | tail -1
          done
      # ... and the fast path must still be REACHED. Byte-identical output
      # cannot see a fast path that quietly stopped being taken; this counts it.
      - name: The whitespace fast path is still plugged in
        run: |
          cargo build -p rusty_json_turbo-bench --release --locked --features turbo/profile
          on=$(RJT_WS_FASTPATH=1 ./target/release/rjson-bench work --cell citm_catalog,dom-parse | tail -1 | awk '{print $3}')
          off=$(RJT_WS_FASTPATH=0 ./target/release/rjson-bench work --cell citm_catalog,dom-parse | tail -1 | awk '{print $3}')
          echo "peek calls: fast=$on slow=$off"
          test "$on" -lt $((off / 2)) \
            || { echo "::error::the whitespace fast path is not removing peek calls (fast=$on slow=$off)"; exit 1; }
      # S4 is GENERATED, not fetched, so `HASHES.txt` cannot gate it. The
      # generator regenerating its own output byte-for-byte is the equivalent
      # check: a corpus that drifted between runs would silently invalidate
      # every number ever taken against it.
      - name: The generated corpora are exactly what their generators produce
        run: |
          python tools/gen-s4.py --check
          python tools/gen-s5-s6.py --check
      # Same rule as the whitespace knob, for the escape scan: both arms must
      # agree with upstream, and the wide arm must actually be reached.
      - name: Both arms of the escape knob agree with upstream
        run: |
          for v in 0 1; do
            RJT_ESC_WIDE=$v cargo run -p rusty_json_turbo-bench --release --locked               --features turbo/knobs -- diff-oracle corpus/twitter.json | tail -1
          done
      - name: The wide escape scan is still plugged in
        run: |
          cargo build -p rusty_json_turbo-bench --release --locked --features turbo/profile
          steps() {
            RJT_ESC_WIDE=$1 ./target/release/rjson-bench work               --cell twitter,dom-stringify | tail -1 | awk '{print $6}'
          }
          on=$(steps 1); off=$(steps 0)
          echo "escape scanner steps: wide=$on scalar=$off"
          test "$on" -lt $((off / 2))             || { echo "::error::the wide escape scan is not removing steps (wide=$on scalar=$off)"; exit 1; }
      # THE ISLAND'S GATE. A vector kernel that disagrees with its scalar
      # oracle on one byte value at one offset is a corruption bug, and the
      # byte-identical contract has to hold at EVERY rung -- including the two
      # this machine may not even select by default.
      # M4's refutations have to keep being true as the code moves. The B6
      # probe's two arms must go on building identical values -- a probe whose
      # arms drift apart stops being a comparison -- and B14's finding is that
      # nothing reaches `deserialize_in_place`, which only a test can hold.
      # S6's gate. The timed corpus exercises the hot paths hard and the cold
      # ones barely at all, so this is where a byte-identical contract quietly
      # breaks. Run at EVERY isa rung, because the newline cases are what would
      # catch a wide whitespace scanner that miscounts lines -- a fault
      # invisible until an error has to name one.
      - name: Cold paths agree with upstream, at every rung
        shell: bash
        run: |
          for isa in scalar swar sse2 avx2; do
            echo "--- RJT_ISA=$isa"
            RJT_ISA=$isa cargo test -p rusty_json_turbo-bench --release --locked               --test s6_cold_paths
          done
      - name: The B6 ceiling probe still compares equal work
        run: |
          cargo run -p rusty_json_turbo-bench --release --locked --             b6 --pairs 3 --window-ms 40 | tee b6.txt
          grep -q 'work parity: 2600 frames' b6.txt             || { echo '::error::the B6 probe arms no longer build identical values'; exit 1; }
      - name: Nothing reaches deserialize_in_place (brick B14)
        run: cargo test -p rusty_json_turbo-bench --release --locked --test b14_reachability
      # The same per-arch census the wasm job runs, on this runner's own
      # architecture -- so the two can be compared, and they agree exactly.
      - name: The wide kernels are reached on this architecture
        run: cargo test -p rusty_json_turbo-bench --release --locked --features count-work --test m6_arch_census -- --nocapture
      # B13's gate, and it has to ASK for `raw_value` or it tests nothing: the
      # tests are `#![cfg(feature = "raw_value")]`, so without the feature they
      # compile to an empty binary that passes -- the same silent-skip shape as
      # the `.ndjson` filter bug and the opt-in island above.
      #
      # `count-work` on the second line is not decoration. B13 grows the reader
      # window for an oversized capture and hands the growth back afterwards,
      # and NEITHER event changes a byte of output, so only the library's own
      # counters can say the growth happened and was returned.
      # The differential oracle compares `to_string_pretty` (`PrettyFormatter`)
      # and `Value::to_string` (`serialize_map`), so **no oracle cell covered
      # compact struct-stringify** -- a column this harness times on every file.
      # These two close that hole. Written for brick B15s, kept after B15s was
      # reverted: the gate has nothing to do with the brick, and the probe
      # carries the lesson that a tight-loop ceiling can refute a brick but
      # never justify one.
      - name: Compact struct-stringify is byte-identical to upstream
        run: |
          cargo test -p rusty_json_turbo-bench --release --locked --test b15s_key_fold
          cargo test -p rusty_json_turbo-bench --release --locked --test b15b_price -- --nocapture
      - name: A RawValue over a reader is captured as a range (brick B13)
        run: |
          cargo test -p rusty_json_turbo-bench --release --locked --features raw_value --test b13_raw_range
          cargo test -p rusty_json_turbo-bench --release --locked --features raw_value,count-work --test b13_counters
      # The island is OPT-IN now (it lost to upstream on 13 of 15 cells), so
      # these gates must ask for it explicitly or they would silently test
      # nothing -- the same silent-skip shape as the `.ndjson` filter bug.
      - name: The SIMD island agrees with its oracle, at every rung
        shell: bash
        run: |
          for isa in scalar swar sse2 avx2; do
            echo "--- RJT_ISA=$isa"
            RJT_ISA=$isa cargo test -p rusty_json_turbo-accel --release --locked
            RJT_ISA=$isa cargo test -p rusty_json_turbo-bench --release --locked               --features turbo/accel --test oracle --test soak
          done
      # The census with the island LINKED, at every rung. This is a different
      # assertion from the census above, and finding out why was M6's sharpest
      # result: `ESC_STEPS` is incremented by the CRATE's scanner once per
      # 8-byte chunk and by the ISLAND once per CALL -- the island is a
      # separate `no_std` crate and cannot reach the parent's statics. The same
      # document reads 101,382 steps without `accel` and 19,327 with it, and
      # off x86_64 the two builds are indistinguishable by ISA name because
      # both say "swar". `counters::accel_linked()` is what tells them apart.
      - name: The census knows which kernel it is looking at, at every rung
        shell: bash
        run: |
          for isa in scalar swar sse2 avx2; do
            echo "--- RJT_ISA=$isa"
            RJT_ISA=$isa cargo test -p rusty_json_turbo-bench --release --locked --features turbo/accel,count-work --test m6_arch_census -- --nocapture
          done
      # The island must also build where there is no x86 at all, falling back
      # to SWAR rather than failing to compile.
      - name: The island builds without x86 and without std
        run: |
          rustup target add wasm32-unknown-unknown aarch64-unknown-linux-musl
          cargo check -p rusty_json_turbo-accel --locked --target wasm32-unknown-unknown --no-default-features
          cargo check -p rusty_json_turbo-accel --locked --target aarch64-unknown-linux-musl --no-default-features
      - name: The allocation census runs and reports non-zero work
        run: |
          cargo run -p rusty_json_turbo-bench --release --locked --features profile -- \
            census --cell twitter,dom-parse --cell twitter,dom-stringify | tee census.txt
          grep -qE 'dom-parse +[0-9]{4,}' census.txt \
            || { echo '::error::census reported no allocations for a DOM parse'; exit 1; }
      # A census build must refuse to be used as a timing instrument.
      - name: The census build refuses to be quoted
        run: |
          cargo run -p rusty_json_turbo-bench --release --locked --features profile -- \
            bench --cell twitter,dom-parse --pairs 1 --window-ms 10 | tee taxed.txt
          grep -q 'COUNTING BUILD' taxed.txt \
            || { echo '::error::a counting build did not flag its method line'; exit 1; }

  # The fuzz targets are the standing gate on untrusted input; they must at
  # least keep building, including the differential one against upstream.
  fuzz:
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins stable, and a toolchain file beats the version
    # the action selected -- so cargo-fuzz's `-Z` flags land on stable and the
    # job dies with "the option `Z` is only accepted on the nightly compiler".
    # RUSTUP_TOOLCHAIN is what overrides the file. (Same trap as a `targets:`
    # given to the action, which also lands on stable rather than the pin.)
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `dtolnay/install@cargo-fuzz` fetches a prebuilt binary and GitHub
      # verifies its artifact attestation. That verification is a THIRD-PARTY
      # SERVICE, and when it is down the job fails with
      # `HTTP 503: trust-metadata-api service unavailable` having never
      # compiled a line -- which is a red gate that says nothing about the
      # code. Take the fast path when it works, and fall back to building from
      # crates.io when it does not, so the gate stays meaningful either way.
      - name: cargo-fuzz (prebuilt, with a source fallback)
        run: |
          if cargo fuzz --version >/dev/null 2>&1; then
            echo "cargo-fuzz already present: $(cargo fuzz --version)"
            exit 0
          fi
          url=https://github.com/dtolnay/install/releases/download/cargo-fuzz/cargo-fuzz
          if curl --location --silent --show-error --fail --retry 3                --output "$HOME/.cargo/bin/cargo-fuzz" "$url"; then
            chmod +x "$HOME/.cargo/bin/cargo-fuzz"
            if cargo fuzz --version >/dev/null 2>&1; then
              echo "cargo-fuzz installed from the prebuilt binary"
              exit 0
            fi
            echo "the prebuilt binary did not run; falling back to a source build"
          else
            echo "the prebuilt download failed; falling back to a source build"
          fi
          cargo install cargo-fuzz --locked
          cargo fuzz --version
      - run: cargo fuzz check

  # Catches a broken manifest or a file the package would ship without --
  # before `cargo publish` does, not after.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The two leaf crates get the full check, build and all.
      - run: cargo package -p rusty_json_turbo-accel --allow-dirty
      - run: cargo package -p rusty_json_turbo-alloc --allow-dirty
      # The parent cannot get the full check yet, and the reason is a real
      # release-ordering constraint rather than a workaround: `cargo package`
      # resolves every dependency against the crates.io index even with
      # `--no-verify`, and `rusty_json_turbo-accel` is not published. So THE
      # ISLAND MUST BE PUBLISHED BEFORE THE NEXT RELEASE OF THE PARENT.
      #
      # Until then this checks what it still can -- that the manifest parses
      # and the file list is what we expect, which is what has actually caught
      # problems here before. Restore the full `cargo package -p
      # rusty_json_turbo --allow-dirty` the moment the island is on crates.io.
      - name: Parent crate file list (full package check blocked on publishing the island)
        run: |
          cargo package --list -p rusty_json_turbo --allow-dirty > files.txt
          wc -l files.txt
          for required in Cargo.toml src/lib.rs src/read.rs src/ser.rs README.md; do
            grep -qx "$required" files.txt               || { echo "::error::$required missing from the packaged file list"; exit 1; }
          done
          if grep -qE '^(corpus|target)/' files.txt; then
            echo '::error::the package would ship corpus or build artifacts'; exit 1
          fi
