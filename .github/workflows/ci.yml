name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# WHAT IS GATED, AND WHY IT IS SCOPED THAT WAY
#
# The shipping artifact is `rusty_json_turbo` (the library, crate name
# `serde_json`), plus the `rjson` CLI and the allocator seam. Those are held to
# `-D warnings` and tested on three OSes, on the MSRV, and across the eight
# targets the house ships.
#
# `rusty_json_turbo-bench` is the harness: it links upstream serde_json as the
# ORACLE and runs the differential gate (bytes, Value, error text + line/col,
# float bits) over the corpus. That gate is a test and runs here on every push.
# The competitor arms (simd-json, sonic-rs) are behind `--features competitors`
# and are only checked for compilation.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # THE CORPUS IS THE MEASUREMENT, so its bytes are gated before anything
      # runs on them, and gated on all three runners -- which is the point.
      # This check did not exist, and its absence hid a real defect: with no
      # root `.gitattributes`, a `core.autocrlf=true` checkout rewrote every
      # payload's line endings, so `HASHES.txt` held the CRLF hashes and was
      # valid only on Windows, CI was benchmarking a `twitter.json` 2.4%
      # smaller than a Windows developer was, and `corpus/fetch.ps1` -- whose
      # entire job is to re-download and verify -- would have failed for
      # anyone who ran it. Verifying on three platforms is what makes
      # "platform-independent" a checked claim rather than an intention.
      - name: The corpus is byte-for-byte the manifest, on every platform
        shell: bash
        working-directory: corpus
        run: |
          shasum -a 256 -c HASHES.txt             || sha256sum -c HASHES.txt             || { echo '::error::corpus does not match HASHES.txt -- see the root .gitattributes'; exit 1; }
      - name: Upstream test suite against the fork
        run: cargo test -p rusty_json_turbo --locked
      - name: Feature matrix (upstream's own list)
        shell: bash
        run: |
          for f in preserve_order float_roundtrip arbitrary_precision float_roundtrip,arbitrary_precision raw_value unbounded_depth; do
            cargo test -p rusty_json_turbo --locked --features "$f" --tests -- --skip ui --exact
          done
      - name: Differential oracle (byte-identical to upstream serde_json)
        run: cargo test -p rusty_json_turbo-bench --locked -- --nocapture
      # The soak is the same question as fuzz/oracle_diff, asked on every runner
      # and every OS: libFuzzer needs nightly and a matching sanitizer runtime,
      # this needs neither. Seeded, so a failure here reproduces exactly.
      - name: Differential soak (300k generated + mutated + numeric cases)
        run: cargo test -p rusty_json_turbo-bench --release --locked --test soak -- --nocapture
        env:
          RJT_SOAK: 100000
      - name: Differential oracle, per feature (both arms on)
        shell: bash
        run: |
          for f in preserve_order float_roundtrip arbitrary_precision raw_value unbounded_depth; do
            cargo test -p rusty_json_turbo-bench --locked --features "$f" --test oracle
          done
      - name: CLI and seam
        run: |
          cargo test -p rusty_json_turbo-cli -p rusty_json_turbo-alloc --locked
          cargo run -p rusty_json_turbo-cli --locked -- --version
          cargo run -p rusty_json_turbo-cli --locked -- validate corpus/twitter.json

  # The eight targets the house ships, library only, default and no_std+alloc.
  check-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.target }}
      - name: default features
        run: cargo check -p rusty_json_turbo --locked --target ${{ matrix.target }}
      - name: no_std + alloc
        run: cargo check -p rusty_json_turbo --locked --target ${{ matrix.target }} --no-default-features --features alloc
      - name: every feature, no_std + alloc
        run: cargo check -p rusty_json_turbo --locked --target ${{ matrix.target }} --no-default-features --features alloc,float_roundtrip,arbitrary_precision,raw_value,unbounded_depth

  # Upstream's own no_std probe crate, unchanged apart from the package rename.
  portable:
    name: no_std probe crate + profile feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml selects the pinned toolchain; a target given to the
      # action lands on `stable`, not on it. Add it to the active toolchain.
      - run: rustup target add aarch64-unknown-none
      - run: cargo check --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc
      - run: cargo check --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,arbitrary_precision
      - run: cargo check --manifest-path tests/crate/Cargo.toml --no-default-features --features alloc,raw_value
      - run: cargo check --manifest-path tests/crate/Cargo.toml --target aarch64-unknown-none --no-default-features --features alloc
      - run: cargo check -p rusty_json_turbo --locked --features profile

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rusty_json_turbo --locked --all-features
        env:
          RUSTUP_TOOLCHAIN: 1.85.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: ASCII sources
        run: bash scripts/check-ascii-rs.sh src crates
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # The harness in every configuration the ledger takes numbers from. Each is a
  # separate BINARY (the allocator is a link-time property), so each has to keep
  # compiling or a measurement arm silently disappears.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features competitors
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features rusty-alloc
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features rusty-alloc-secure
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features profile
      - run: cargo check -p rusty_json_turbo-bench --all-targets --locked --features turbo/knobs
      # The A/B knob must actually switch the arm, and BOTH arms must agree with
      # upstream. A knob that silently does nothing would let a brick look free.
      - name: Both arms of the whitespace knob agree with upstream
        run: |
          for v in 0 1; do
            RJT_WS_FASTPATH=$v cargo run -p rusty_json_turbo-bench --release --locked \
              --features turbo/knobs -- diff-oracle corpus/citm_catalog.json | tail -1
          done
      # ... and the fast path must still be REACHED. Byte-identical output
      # cannot see a fast path that quietly stopped being taken; this counts it.
      - name: The whitespace fast path is still plugged in
        run: |
          cargo build -p rusty_json_turbo-bench --release --locked --features turbo/profile
          on=$(RJT_WS_FASTPATH=1 ./target/release/rjson-bench work --cell citm_catalog,dom-parse | tail -1 | awk '{print $3}')
          off=$(RJT_WS_FASTPATH=0 ./target/release/rjson-bench work --cell citm_catalog,dom-parse | tail -1 | awk '{print $3}')
          echo "peek calls: fast=$on slow=$off"
          test "$on" -lt $((off / 2)) \
            || { echo "::error::the whitespace fast path is not removing peek calls (fast=$on slow=$off)"; exit 1; }
      # S4 is GENERATED, not fetched, so `HASHES.txt` cannot gate it. The
      # generator regenerating its own output byte-for-byte is the equivalent
      # check: a corpus that drifted between runs would silently invalidate
      # every number ever taken against it.
      - name: The S4 corpus is exactly what its generator produces
        run: python tools/gen-s4.py --check
      # Same rule as the whitespace knob, for the escape scan: both arms must
      # agree with upstream, and the wide arm must actually be reached.
      - name: Both arms of the escape knob agree with upstream
        run: |
          for v in 0 1; do
            RJT_ESC_WIDE=$v cargo run -p rusty_json_turbo-bench --release --locked               --features turbo/knobs -- diff-oracle corpus/twitter.json | tail -1
          done
      - name: The wide escape scan is still plugged in
        run: |
          cargo build -p rusty_json_turbo-bench --release --locked --features turbo/profile
          steps() {
            RJT_ESC_WIDE=$1 ./target/release/rjson-bench work               --cell twitter,dom-stringify | tail -1 | awk '{print $6}'
          }
          on=$(steps 1); off=$(steps 0)
          echo "escape scanner steps: wide=$on scalar=$off"
          test "$on" -lt $((off / 2))             || { echo "::error::the wide escape scan is not removing steps (wide=$on scalar=$off)"; exit 1; }
      - name: The allocation census runs and reports non-zero work
        run: |
          cargo run -p rusty_json_turbo-bench --release --locked --features profile -- \
            census --cell twitter,dom-parse --cell twitter,dom-stringify | tee census.txt
          grep -qE 'dom-parse +[0-9]{4,}' census.txt \
            || { echo '::error::census reported no allocations for a DOM parse'; exit 1; }
      # A census build must refuse to be used as a timing instrument.
      - name: The census build refuses to be quoted
        run: |
          cargo run -p rusty_json_turbo-bench --release --locked --features profile -- \
            bench --cell twitter,dom-parse --pairs 1 --window-ms 10 | tee taxed.txt
          grep -q 'COUNTING BUILD' taxed.txt \
            || { echo '::error::a counting build did not flag its method line'; exit 1; }

  # The fuzz targets are the standing gate on untrusted input; they must at
  # least keep building, including the differential one against upstream.
  fuzz:
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins stable, and a toolchain file beats the version
    # the action selected -- so cargo-fuzz's `-Z` flags land on stable and the
    # job dies with "the option `Z` is only accepted on the nightly compiler".
    # RUSTUP_TOOLCHAIN is what overrides the file. (Same trap as a `targets:`
    # given to the action, which also lands on stable rather than the pin.)
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `dtolnay/install@cargo-fuzz` fetches a prebuilt binary and GitHub
      # verifies its artifact attestation. That verification is a THIRD-PARTY
      # SERVICE, and when it is down the job fails with
      # `HTTP 503: trust-metadata-api service unavailable` having never
      # compiled a line -- which is a red gate that says nothing about the
      # code. Take the fast path when it works, and fall back to building from
      # crates.io when it does not, so the gate stays meaningful either way.
      - name: cargo-fuzz (prebuilt, with a source fallback)
        run: |
          if cargo fuzz --version >/dev/null 2>&1; then
            echo "cargo-fuzz already present: $(cargo fuzz --version)"
            exit 0
          fi
          url=https://github.com/dtolnay/install/releases/download/cargo-fuzz/cargo-fuzz
          if curl --location --silent --show-error --fail --retry 3                --output "$HOME/.cargo/bin/cargo-fuzz" "$url"; then
            chmod +x "$HOME/.cargo/bin/cargo-fuzz"
            if cargo fuzz --version >/dev/null 2>&1; then
              echo "cargo-fuzz installed from the prebuilt binary"
              exit 0
            fi
            echo "the prebuilt binary did not run; falling back to a source build"
          else
            echo "the prebuilt download failed; falling back to a source build"
          fi
          cargo install cargo-fuzz --locked
          cargo fuzz --version
      - run: cargo fuzz check

  # Catches a broken manifest or a file the package would ship without --
  # before `cargo publish` does, not after.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p rusty_json_turbo --allow-dirty
