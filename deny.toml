# cargo-deny -- enforces the no-copyleft / no-C promise on the shipped graph.
# CI: cargo deny check

[graph]
all-features = true
# The SHIPPED graph is what is policed. Upstream's dev-dependency serde_stacker
# pulls psm (C, dev-only, never linked into any artifact); M1 of the mission
# plan replaces the one test that uses it. Dev-dependencies stay out here so
# that exception cannot silently widen into a shipped one.
exclude-dev = true

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # memchr
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "cc" },
    { crate = "cmake" },
    { crate = "openssl-sys" },
    { crate = "zstd-sys" },
    { crate = "libz-sys" },
    { crate = "lzma-sys" },
    { crate = "lz4-sys" },
    { crate = "psm" },
    { crate = "jemallocator" },
    { crate = "tikv-jemallocator" },
    { crate = "mimalloc" },
    { crate = "snmalloc-rs" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Remade-With-Rust/serde",
]
