[toolchain]
# Pinned so every machine and CI runner builds the same bits. The MSRV (1.85)
# is checked separately in CI with an explicit RUSTUP_TOOLCHAIN.
channel = "1.98.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
