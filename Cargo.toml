# rusty_json_turbo -- serde_json, forked and made fast the house way.
#
# LAYOUT. The upstream crate stays at the workspace ROOT (src/, tests/, build.rs,
# fuzz/) so `git merge upstream/master` is a plain merge; the house crates live
# under crates/. A deliberate deviation from the crates/<name> scaffold, recorded
# in docs/plans/fast_mission.md (decision 11) and docs/UPSTREAM-CHANGES.md.
#
# NAME. The package is `rusty_json_turbo`; the LIBRARY keeps upstream's crate
# name `serde_json` (the rustls-webpki precedent: package `rustls-webpki`, lib
# `webpki`) so every `use serde_json::...` in upstream's tests and doctests and
# in every consumer is a drop-in, and no upstream line has to move.
#
# VERSION. 0.x until the use-protection-please gate says 1.0.0 (a security gate,
# not a feature gate). The upstream version this tracks is in `description`
# and in docs/UPSTREAM-CHANGES.md.

[package]
name = "rusty_json_turbo"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_json_turbo"
categories = ["encoding", "parser-implementations", "no-std"]
keywords = ["json", "serde", "serialization", "parser", "no-std"]
description = "serde_json, forked and made fast the house way: the same API, the same bytes out, the same errors at the same line and column -- gated byte-identical against upstream every commit. Pure Rust, no C, no *-sys. Tracks serde_json 1.0.151."
exclude = [
    "/.github",
    "/corpus",
    "/crates",
    "/docs",
    "/fuzz",
    "/scripts",
    "/tests/crate",
    "/tools",
]

[lib]
name = "serde_json"

[dependencies]
# The SIMD island. Ours, pure Rust, no build script, no dependencies of its
# own -- so the "empty dependency tree" claim in the README still holds.
rusty_json_turbo-accel = { version = "0.1.0", path = "crates/rusty_json_turbo-accel", default-features = false, optional = true }
indexmap = { version = "2.2.3", optional = true }
itoa = "1.0"
memchr = { version = "2", default-features = false }
serde_core = { version = "1.0.220", default-features = false }
zmij = "1.0"

[target.'cfg(any())'.dependencies]
serde = { version = "1.0.220", default-features = false }

[dev-dependencies]
automod = "1.0.11"
indoc = "2.0.2"
ref-cast = "1.0.18"
rustversion = "1.0.13"
serde = { version = "1.0.194", features = ["derive"] }
serde_bytes = "0.11.10"
serde_derive = "1.0.166"
serde_stacker = "0.1.8"
trybuild = { version = "1.0.108", features = ["diff"] }

[package.metadata.docs.rs]
features = ["preserve_order", "raw_value", "unbounded_depth"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--extern-html-root-url=core=https://doc.rust-lang.org",
    "--extern-html-root-url=alloc=https://doc.rust-lang.org",
    "--extern-html-root-url=std=https://doc.rust-lang.org",
]

[package.metadata.playground]
features = ["float_roundtrip", "raw_value", "unbounded_depth"]


### FEATURES #################################################################

[features]
default = ["std"]

# `accel/std` is what lets the island detect AVX2 at runtime; without `std`
# it still reaches SSE2 on x86-64, which is baseline and needs no detection.
std = ["memchr/std", "serde_core/std", "rusty_json_turbo-accel?/std"]

# Provide integration for heap-allocated collections without depending on the
# rest of the Rust standard library.
# NOTE: Disabling both `std` *and* `alloc` features is not supported yet.
alloc = ["serde_core/alloc"]

# Make serde_json::Map use a representation which maintains insertion order.
# This allows data to be read into a Value and written back to a JSON string
# while preserving the order of map keys in the input.
preserve_order = ["indexmap", "std"]

# Use sufficient precision when parsing fixed precision floats from JSON to
# ensure that they maintain accuracy when round-tripped through JSON. This comes
# at an approximately 2x performance cost for parsing floats compared to the
# default best-effort precision.
#
# Unlike arbitrary_precision, this feature makes f64 -> JSON -> f64 produce
# output identical to the input.
float_roundtrip = []

# Use an arbitrary precision number representation for serde_json::Number. This
# allows JSON numbers of arbitrary size/precision to be read into a Number and
# written back to a JSON string without loss of precision.
#
# Unlike float_roundtrip, this feature makes JSON -> serde_json::Number -> JSON
# produce output identical to the input.
arbitrary_precision = []

# Provide a RawValue type that can hold unprocessed JSON during deserialization.
raw_value = []

# Provide a method disable_recursion_limit to parse arbitrarily deep JSON
# structures without any consideration for overflowing the stack. When using
# this feature, you will want to provide some other way to protect against stack
# overflows, such as by wrapping your Deserializer in the dynamically growing
# stack adapter provided by the serde_stacker crate. Additionally you will need
# to be careful around other recursive operations on the parsed result which may
# overflow the stack after deserialization has completed, including, but not
# limited to, Display and Debug and Drop impls.
unbounded_depth = []

# Runtime A/B knobs (`RJT_*`). OFF in a shipped build: every routing decision
# they gate is then a compile-time constant, so the shipping arm costs nothing.
# Turn them on to A/B two implementations **in one binary** -- which is the only
# way to compare them without also comparing two code layouts, and layout alone
# has measured +-13% between two builds of this crate.
knobs = ["std"]
# The SIMD island (M3). A separate crate so THIS one never writes `unsafe` for
# a vector load. Pure Rust, no build script, no transitive dependencies.
#
# OFF BY DEFAULT, and that is a measured decision that reverses the one made
# when it landed. Against UPSTREAM -- which is the comparison that matters and
# the one M3's own measurement never made -- the island LOSES on 9 of 15 cells
# and wins on none convincingly:
#
#   cell                       island off   island on
#   canada struct-parse           1.029       1.236
#   canada dom-parse              0.958       1.245
#   canada scan                   1.120       1.335
#   twitter struct-parse          0.969       1.159
#   twitter scan                  1.048       1.280
#   citm struct-stringify         0.951       1.154
#   citm scan                     0.882       0.995
#
# (Lower is better; these are ours/upstream time.) Note `canada scan`, which
# contains 33 whitespace bytes in 2.25 MB: the island cannot be doing any
# scanning there, so its cost is NOT the scan. A `#[target_feature]` function
# cannot be inlined into a caller that lacks the feature, so reaching the
# island puts a non-inlinable call inside `scan_ws_run`, which stops
# `scan_ws` -- and with it `skip_whitespace` and `parse_whitespace` -- from
# inlining into the parser's hot loop. The lost inlining costs more than the
# extra width buys.
#
# The crate stays, fully tested and reachable, so this can be re-measured on a
# machine or a workload where the trade comes out differently. See
# `corpus/LEDGER.md` under "M3 reversed".
accel = ["dep:rusty_json_turbo-accel"]
# The deterministic work counters in `counters`. Implies `knobs` so a counting
# build can also toggle the arm it is counting. NEVER quote a timing from a
# build with this on: it adds an atomic increment to the hottest paths, and it
# taxes the two arms unequally, which would flatter whichever does less work.
profile = ["std", "knobs"]

[lints.rust]
# Inherited from upstream: 12 `unsafe` sites (from_utf8_unchecked on validated
# runs, the SWAR scanner's offset_from, the WTF-8 push, RawValue transmutes).
# M2 of the mission plan moves them behind -accel or replaces them with safe
# code, with the census in corpus/LEDGER.md. Until then this crate cannot take
# the workspace `unsafe_code = "deny"`, and a crate-level table replaces the
# workspace table entirely, so the other rows are repeated here.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"


### WORKSPACE ################################################################

[workspace]
resolver = "2"
members = ["crates/*"]
# Both carry their own manifests and were never workspace members upstream.
exclude = ["fuzz", "tests/crate"]

[workspace.package]
# One version across the family, bumped together, the way the sibling codec
# workspaces do it: a consumer that pins one crate can pin them all.
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_json_turbo"
authors = [
    "Mata Network <https://www.mata.network>",
    "Erick Tryzelaar <erick.tryzelaar@gmail.com>",
    "David Tolnay <dtolnay@gmail.com>",
]
homepage = "https://www.mata.network/remade-with-rust"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# The ORACLE. Upstream serde_json, pinned to the exact version this fork tracks,
# linked into the harness under a rename so both arms live in one binary.
serde_json_upstream = { package = "serde_json", version = "=1.0.151" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# The serde fork: crate names and versions unchanged, consumed as an overlay so
# every `impl Serialize` in the ecosystem keeps working (mission plan §9.2).
# Local development against a checkout: put a `[patch."https://github.com/
# Remade-With-Rust/serde.git"]` table with `path = "../serde/<crate>"` rows in
# a gitignored .cargo/config.toml, and re-lock without it before committing.
[patch.crates-io]
serde = { git = "https://github.com/Remade-With-Rust/serde.git", branch = "turbo" }
serde_core = { git = "https://github.com/Remade-With-Rust/serde.git", branch = "turbo" }
serde_derive = { git = "https://github.com/Remade-With-Rust/serde.git", branch = "turbo" }
