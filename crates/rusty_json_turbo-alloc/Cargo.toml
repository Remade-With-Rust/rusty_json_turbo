[package]
name = "rusty_json_turbo-alloc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Ours alone: no upstream serde code reaches this crate, so it does not inherit
# the workspace author list.
authors = ["Mata Network <https://www.mata.network>"]
readme = "README.md"
documentation = "https://docs.rs/rusty_json_turbo-alloc"
categories = ["memory-management", "no-std"]
keywords = ["allocator", "rusty-alloc", "json", "performance"]
description = "The rusty_alloc seam for rusty_json_turbo deliverables: install the house allocator in one line, from the binary, where a global allocator belongs. On a JSON DOM parse that alone measured 1.46-1.53x. forbid(unsafe). MIT OR Apache-2.0."

[dependencies]
# Pinned exactly. This crate exists so that this pin, the profile choice and
# the `secure` decision live in ONE place instead of being re-made in every
# binary -- and so no feature code ever names `rusty_alloc-api` directly.
rusty_alloc-api = { version = "=2.0.4" }

[features]
# Forwarded, never re-spelled: `secure` turns on guard pages and encrypted free
# lists (the profile for a service eating untrusted bytes); `debug_checks`
# belongs in debug profiles only. A deliverable picks these HERE, once.
secure = ["rusty_alloc-api/secure"]
debug_checks = ["rusty_alloc-api/debug_checks"]

[lints]
workspace = true
