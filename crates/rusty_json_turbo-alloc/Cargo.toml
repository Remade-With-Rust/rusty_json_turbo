[package]
name = "rusty_json_turbo-alloc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "rusty_alloc seam for rusty_json_turbo deliverables -- never depend on rusty_alloc-api from feature code"
publish = false

[dependencies]
rusty_alloc-api = { version = "=2.0.4" }

[features]
# Forwarded, never re-spelled: `secure` turns on guard pages and encrypted free
# lists (the profile for a service eating untrusted bytes); `debug_checks`
# belongs in debug profiles only. A deliverable picks these HERE, once, so no
# feature code ever names rusty_alloc.
secure = ["rusty_alloc-api/secure"]
debug_checks = ["rusty_alloc-api/debug_checks"]

[lints]
workspace = true
