[package]
name = "rusty_json_turbo-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The harness: in-process differential oracle against upstream serde_json, and the paired ABBA benchmark over JSONCORP. Never published."
publish = false

[lib]
name = "rjt_bench"

[[bin]]
name = "rjson-bench"
path = "src/main.rs"

[dependencies]
# Ours, under the name `turbo` so the two arms read unambiguously in code.
turbo = { package = "rusty_json_turbo", path = "../.." }
# The oracle: upstream serde_json at the exact version this fork tracks.
#
# `raw_value` is enabled HERE, on UPSTREAM only, and deliberately not on
# `turbo`. The per-message latency cell needs to slice a container document
# into its individual records with their original bytes intact -- whitespace
# and key order included, since one of the S4 payloads is 54.9% whitespace and
# re-serializing would silently measure a different document. `RawValue` is the
# right tool for that, but switching it on for `turbo` would compile extra
# `cfg`-gated paths into the crate under measurement and move every timing in
# the suite. Cargo features are additive, so that could not be undone from a
# consumer's manifest either. Slicing with the oracle's copy costs the measured
# arm nothing.
serde_json_upstream = { workspace = true, features = ["raw_value"] }
# The house allocator, through the seam, for the `rusty-alloc` build arm. Only
# this binary installs it; the library never does.
alloc_seam = { package = "rusty_json_turbo-alloc", path = "../rusty_json_turbo-alloc", optional = true }
# Optional only so the fixture files (verbatim from json-benchmark) can keep
# their `#[cfg(feature = "serde")]` gates; it is on by default and required.
serde = { workspace = true, optional = true }
simd-json = { version = "0.18", optional = true }
sonic-rs = { version = "0.5", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
# The competitor arms. Never on in a shipped artifact; this crate ships nothing.
competitors = ["dep:simd-json", "dep:sonic-rs"]
# The house allocator as a BUILD ARM. A global allocator is one per program, so
# this cannot be a runtime switch: it makes a second binary, compared with the
# other by tools/pinvs.ps1. `--features rusty-alloc-secure` is the hardened
# profile (guard pages, encrypted free lists).
rusty-alloc = ["dep:alloc_seam"]
rusty-alloc-secure = ["rusty-alloc", "alloc_seam/secure"]
# The allocation census (a counting wrapper around whichever backend is linked).
# Deterministic work-parity instrument; taxes every allocation, so a build with
# it must never produce a timing number.
profile = []
# Feature forwarding so the oracle runs with BOTH arms on the same feature.
preserve_order = ["turbo/preserve_order", "serde_json_upstream/preserve_order"]
float_roundtrip = ["turbo/float_roundtrip", "serde_json_upstream/float_roundtrip"]
arbitrary_precision = ["turbo/arbitrary_precision", "serde_json_upstream/arbitrary_precision"]
raw_value = ["turbo/raw_value", "serde_json_upstream/raw_value"]
unbounded_depth = ["turbo/unbounded_depth", "serde_json_upstream/unbounded_depth"]
# The LIBRARY's work counters, which are a different instrument from the
# allocation census above: `profile` here counts this harness's allocations,
# `count-work` counts the parser's own work. Brick B13 needs it, because
# growing and returning the reader window has no output difference to gate it
# with -- only a counter can say the growth happened and was handed back.
count-work = ["turbo/profile"]

# A crate-level table replaces the workspace table entirely, so the workspace
# rows are repeated here. The extra row: the fixture files are verbatim from
# json-benchmark and carry that crate's `lib-rustc-serialize` cfg on impls this
# crate never builds; check-cfg is told the name so `-D warnings` stays honest
# without a fake feature that `--all-features` would switch on.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("lib-rustc-serialize"))'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
